name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: test -z "$(gofmt -l ./cmd ./internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml
      - run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/quota-monitor.exe ./cmd/quota-monitor
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/quota-monitor-arm64 ./cmd/quota-monitor

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r firmware/requirements.txt
      - run: pio test -d firmware -e native
      - name: Install non-production device CA fixture
        run: cp firmware/certs/device-root-ca.example.pem firmware/certs/device-root-ca.pem
      - run: pio run -d firmware -e firebeetle2_esp32s3 -j 1
