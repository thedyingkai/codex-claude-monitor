[platformio]
default_envs = e32r28t
src_dir = src
include_dir = include

[env:e32r28t]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
build_src_filter = +<*> -<lcd_smoke.cpp>
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = min_spiffs.csv
board_build.embed_txtfiles =
    certs/isrgrootx1.pem
    certs/device-root-ca.pem
board_build.embed_files =
    assets/qmon-background.rgb565
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.2.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D QUOTA_BOARD_E32R28T=1
    -D CORE_DEBUG_LEVEL=1
    -D LV_CONF_SKIP=1
    -D LV_COLOR_DEPTH=16
    -D LV_USE_FONT_COMPRESSED=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1

[env:e32r28t_lcd_smoke]
extends = env:e32r28t
build_src_filter = -<*> +<lcd_smoke.cpp>
lib_deps = bodmer/TFT_eSPI@2.5.43

; Development-only image for an end-to-end test against a disposable token on
; a trusted RFC1918 LAN. The normal e32r28t image remains HTTPS-only.
[env:e32r28t_dev]
extends = env:e32r28t
build_flags =
    ${env:e32r28t.build_flags}
    -D QUOTA_ALLOW_LAN_HTTP=1

[env:firebeetle2_esp32s3]
platform = espressif32@6.10.0
board = dfrobot_firebeetle2_esp32s3
framework = arduino
build_src_filter = +<*> -<lcd_smoke.cpp>
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.embed_txtfiles =
    certs/isrgrootx1.pem
    certs/device-root-ca.pem
board_build.embed_files =
    assets/qmon-background.rgb565
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.2.1
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D QUOTA_BOARD_FIREBEETLE2=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D LV_CONF_SKIP=1
    -D LV_COLOR_DEPTH=16
    -D LV_USE_FONT_COMPRESSED=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=16
    -D TFT_MOSI=15
    -D TFT_SCLK=17
    -D TFT_CS=18
    -D TFT_DC=3
    -D TFT_RST=38
    -D TOUCH_CS=12
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1

[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_deps = bblanchon/ArduinoJson@7.2.1
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
