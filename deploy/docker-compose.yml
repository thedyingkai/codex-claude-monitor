services:
  monitor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${MONITOR_VERSION:-dev}
    restart: unless-stopped
    command: ["server", "--listen=:8787", "--db=/data/monitor.db", "--firmware-dir=/data/firmware"]
    volumes:
      - monitor-data:/data
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      MONITOR_DOMAIN: ${MONITOR_DOMAIN:?set MONITOR_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # `edge` gives Caddy outbound access for ACME/OCSP; only Caddy joins it.
    # The Go service remains isolated on the internal backend network.
    networks: [edge, backend]
    depends_on: [monitor]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  backend:
    internal: true

volumes:
  monitor-data:
  caddy-data:
  caddy-config:
